name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: read
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate version
        shell: bash
        run: |
          version="$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' gradle.properties)"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$version" = "$tag_version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Prepare release notes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          ./scripts/new-release-notes.ps1 `
            -Version $env:VERSION `
            -OutputPath dist/release-notes.md
      - name: Build RVP
        env:
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GPR_KEY || github.token }}
        run: ./gradlew :patches:buildAndroid --no-daemon
      - name: Prepare release assets
        shell: pwsh
        run: |
          Copy-Item "patches/build/libs/patches-$env:VERSION.rvp" dist/patches.rvp
          ./scripts/new-patches-manifest.ps1 `
            -Repository $env:GITHUB_REPOSITORY `
            -Tag $env:GITHUB_REF_NAME `
            -Version $env:VERSION `
            -CreatedAt ([DateTimeOffset]::UtcNow.ToString('O')) `
            -OutputPath dist/patches.json
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/patches.rvp
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/patches.rvp dist/patches.json --verify-tag --notes-file dist/release-notes.md
