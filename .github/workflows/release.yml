name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: read
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate version
        shell: bash
        run: |
          version="$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' gradle.properties)"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$version" = "$tag_version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Prepare release notes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          ./scripts/new-release-notes.ps1 `
            -Version $env:VERSION `
            -OutputPath dist/release-notes.md
      - name: Build RVP
        env:
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GPR_KEY || github.token }}
        run: ./gradlew :patches:buildAndroid --no-daemon
      - name: Prepare release assets
        shell: pwsh
        run: |
          Copy-Item "patches/build/libs/patches-$env:VERSION.rvp" dist/patches.rvp
          ./scripts/new-patches-manifest.ps1 `
            -Repository $env:GITHUB_REPOSITORY `
            -Tag $env:GITHUB_REF_NAME `
            -Version $env:VERSION `
            -CreatedAt ([DateTimeOffset]::UtcNow.ToString('O')) `
            -OutputPath dist/patches.json
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/patches.rvp
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/patches.rvp dist/patches.json --verify-tag --notes-file dist/release-notes.md

      - name: Publish patches.json to the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_PATH: dist/patches.json
        shell: bash
        run: |
          set -euo pipefail
          latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          if [[ "$latest_tag" != "$GITHUB_REF_NAME" ]]; then
            echo "Skipping manifest update for a release that is not the latest."
            exit 0
          fi
          jq -e --arg version "${GITHUB_REF_NAME#v}" \
            '(.version | ltrimstr("v")) == $version and
             (.download_url | type == "string") and
             (.created_at | type == "string") and
             (.description | type == "string")' "$MANIFEST_PATH" >/dev/null
          branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)"
          git fetch --no-tags origin "$branch"
          sha="$(git ls-tree FETCH_HEAD -- patches.json | awk '{print $3}')"
          jq -n --arg branch "$branch" --arg sha "$sha" \
            --rawfile manifest "$MANIFEST_PATH" \
            '{branch: $branch,
              message: "chore(release): 配布用patches.jsonを更新",
              content: ($manifest | @base64)} +
             (if $sha == "" then {} else {sha: $sha} end)' > manifest-update.json
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$GITHUB_REF_NAME"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/patches.json" \
            --input manifest-update.json
